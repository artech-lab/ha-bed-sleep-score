name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect and what happened instead?
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Bed Sleep Score version
    validations:
      required: true
  - type: textarea
    id: sensor
    attributes:
      label: Bed sensor
      description: Accelerometer hardware, the sensors selected in the integration and their update rate.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Devices & services → Bed Sleep Score → ⋮ → Download diagnostics. Attach the file.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines with `custom_components.bed_sleep_score` set to debug.
      render: text
