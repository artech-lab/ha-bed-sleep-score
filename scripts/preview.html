// Demo data: fictional scores, the last one matches the breakdown shown.
const lang = new URLSearchParams(location.search).get("lang") || "en";
const scores = [78, 91, 64, 88, 72, 95, 84];
const history = scores.map((score, i) => {
  const day = new Date();
  day.setDate(day.getDate() - (scores.length - 1 - i));
  day.setHours(7, 30, 0, 0);
  const key = [day.getFullYear(), String(day.getMonth() + 1).padStart(2, "0"), String(day.getDate()).padStart(2, "0")].join("-");
  return { s: String(score), a: { night_of: key }, lu: day.getTime() / 1000 };
});

  "sensor.sleep_tracker_score": ["score", 84, {
    components: { continuity: 30, movements: 20.8, wakeups: 13.3, calm: 10, intensity: 10 },
    max_points: { continuity: 30, movements: 25, wakeups: 20, calm: 15, intensity: 10 }

  "sensor.sleep_tracker_score_7_day_average": ["score_7_day_average", 81.6],
  "sensor.sleep_tracker_movements": ["movements", 10],

  "time.sleep_tracker_window_start": ["window_start", "23:30:00"],
  "time.sleep_tracker_window_end": ["window_end", "07:30:00"]
};

  language: lang,
  locale: { language: lang },
  states: {},
  entities: {},
  connection: {
    sendMessagePromise: async (msg) =>
      msg.type.startsWith("history") ? { "sensor.sleep_tracker_score": history } : {}
  }
};
for (const [id, [key, state, attributes]] of Object.entries(demo)) {
  hass.states[id] = { state: String(state), attributes: attributes || {} };
  hass.entities[id] = { entity_id: id, device_id: "demo", platform: "bed_sleep_score", translation_key: key };
}
const Card = customElements.get("bed-sleep-score-card");
for (const pane of document.querySelectorAll(".pane")) {
  const card = document.createElement("bed-sleep-score-card");
  card.setConfig({ type: "custom:bed-sleep-score-card", ...Card.getStubConfig(hass) });

  card.hass = hass;
}
